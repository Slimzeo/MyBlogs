{{define "topbar"}}
<header id="blog-topbar" class="topBar compactTopBar">
  <nav class="siteMenuNav siteFrame" aria-label="主导航">
    <div class="siteMenuBrand">
      <a class="brand" href="/" aria-label="HYPNOS Cloud 首页" data-guide-message="返回 HYPNOS Cloud 首页，阅读最近的记录"><span class="brandLogo">HYPNOS Cloud</span></a>
      <button type="button" class="siteMenuAgentBadge" data-agent-read-entry="" aria-label="让 AI 帮我读本站，复制博客地址和阅读说明">
        <svg class="blog-chatbot-icon" viewBox="0 0 36 28" aria-hidden="true" focusable="false">
          <path d="M5 2h27q2 0 1.6 2l-2.2 15q-.2 2-2.2 2H17l-7 5 1-5H3q-2 0-1.6-2L3.4 4Q3.7 2 5 2Z" fill="#151515" stroke="#eee" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M12 8h3l-1 7h-3zm7 0h3l-1 7h-3z" fill="#fff"/>
        </svg>
        <svg class="siteMenuAgentShape" aria-hidden="true" focusable="false"><path></path></svg>
        <svg class="siteMenuAgentEyes" viewBox="10.28 1.93945 5.92 7.75" fill="currentColor" aria-hidden="true" focusable="false"><g class="siteMenuAgentEyeLength"><path d="M12.77 1.93945H11.39L10.28 9.68945H11.74L12.77 1.93945Z"></path><path d="M16.2 1.93945H14.82L13.71 9.68945H15.17L16.2 1.93945Z"></path></g></svg>
      </button>
    </div>
    <div class="siteReadingControls"><div class="siteMenuCluster">
      <button class="siteMenuToggle" type="button" data-site-menu-toggle aria-expanded="false" aria-controls="blog-nav-panel" aria-label="展开导航菜单"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="menu-bars" d="M3 6h18M3 12h18M3 18h18"/><path class="menu-close" d="m5 5 14 14M19 5 5 19"/></svg></button>
      <div class="siteMenuPanel" id="blog-nav-panel"><div id="navbar-menu" class="siteMenuLinks">
        <a href="/" data-guide-message="回到首页，按时间阅读日记、读书笔记和文章" {{if or (eq .Active "home") (eq .Active "blogs")}}aria-current="page"{{end}}><svg class="blog-nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M1 10.5 12 2l11 8.5-1.7 2.2L12 5.6l-9.3 7.1zM4.5 13l7.5-5.7 7.5 5.7v8H14v-6h-4v6H4.5z"/></svg>Home</a>
        {{if moduleEnabled "archives"}}<a href="/archives" data-guide-message="文章归档，按年份查找发表过的文章" {{if eq .Active "archives"}}aria-current="page"{{end}}><svg class="blog-nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M2 4h20v4H2zm2 5.5h16v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-10zm5 2v2h6v-2H9z"/></svg>Archives</a>{{end}}
        <a href="/categories" data-guide-message="浏览文章专栏，打开一个专栏阅读其中的文章" {{if eq .Active "categories"}}aria-current="page"{{end}}><svg class="blog-nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2.5 4.5h8v7h-8zm0 9h8v7h-8zm10 0h8v7h-8zM16.5 2l5 5-5 5-5-5z"/></svg>Categories</a>
        <a href="/tags" data-guide-message="浏览文章标签，找到不同专栏里写到同一话题的文章" {{if eq .Active "tags"}}aria-current="page"{{end}}><svg class="blog-nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M2 3h9l11 11-8 8L2 10V3zm5 2.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></svg>Tags</a>
        {{if moduleEnabled "about"}}<a href="/about" data-guide-message="关于我，认识 Hypnos，了解我的兴趣和近况" {{if eq .Active "about"}}aria-current="page"{{end}}><svg class="blog-nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="7" r="4.2"/><path d="M3.5 19.2a7 7 0 0 1 7-7h3a7 7 0 0 1 7 7c0 1.2-.8 1.8-2 1.8h-13c-1.2 0-2-.6-2-1.8z"/></svg>About</a>{{end}}
      </div></div>
    </div></div>
    <div class="navActions">
      <button type="button" class="blog-action blog-search-open" data-blog-search-open aria-label="搜索文章" aria-haspopup="dialog" aria-controls="blog-search" data-guide-message="站内搜索，输入标题关键词查找博客文章"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button>
      {{if .AccessKeyEnabled}}<button type="button" class="blog-action" id="access-key-toggle" aria-haspopup="dialog" aria-controls="access-key-modal" aria-label="{{if .EncryptedAccess}}加密文章已授权{{else}}导入访问密钥{{end}}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0{{if not .EncryptedAccess}}v3{{end}}M12 14v2"/></svg></button>{{end}}
      <button type="button" class="blog-action" id="color-toggle" data-blog-theme aria-label="切换明暗模式"><svg class="blog-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.4A8.6 8.6 0 0 1 9.6 3.5 8.7 8.7 0 1 0 20.5 14.4Z"/></svg><svg class="blog-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg></button>
    </div>
  </nav>
</header>
{{end}}
